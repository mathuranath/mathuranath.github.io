<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

<body>
  <div class="bg-glow"></div>
  <div class="page">

      <p id="role" class="meta"></p>

      <div id="contact" class="contact"></div>
      <div class="cta-row">
        <a id="resumeLink" class="btn primary" href="resume/Mathuranath-latest.pdf" download>Download Resume (PDF)</a>

    </header>

    <main>
      <section class="panel">
        <h2>About</h2>
        <p id="about"></p>
      </section>

      <section class="panel">
        <h2>Projects</h2>
        <div id="projects" class="grid"></div>
      </section>

      <section class="panel">
        <h2>Skills</h2>
        <ul id="skills" class="chips"></ul>
      </section>

      <section class="panel">
        <h2>Interests</h2>
        <ul id="interests" class="list"></ul>
      </section>
    </main>

    <footer>
      <p>Built and maintained by <span id="footerName">Mathuranath B</span></p>

  <script src="profile-data.js"></script>
